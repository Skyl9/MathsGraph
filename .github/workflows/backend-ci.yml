name: Backend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up uv and Python 3.13
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.13"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Create .env file for tests
      run: |
        echo "DB_NAME=test_fastapi_db" > .env
        echo "DB_USER=postgres" >> .env
        echo "DB_PASSWORD=password" >> .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=5432" >> .env
        echo "SECRET_KEY=test_secret_key" >> .env
        echo "ALGORITHM=HS256" >> .env
        echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
        echo "ENVIRONMENT=test" >> .env
        echo "DBTESTLINK=postgresql://postgres:password@localhost:5432/test_fastapi_db" >> .env
        echo "PASSWORD_SALT=test_salt" >> .env
        echo "SMTP_HOST=localhost" >> .env
        echo "SMTP_PORT=1025" >> .env
        echo "SMTP_USER=test_user" >> .env
        echo "SMTP_PASSWORD=test_password" >> .env

    - name: Run Pytest
      env:
        DB_USER: postgres
        DB_PASSWORD: password
        DB_NAME: test_fastapi_db
        DB_HOST: localhost
        DB_PORT: 5432
      run: |
        uv run pytest tests/