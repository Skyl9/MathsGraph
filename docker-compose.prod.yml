version: '3.8'

services:
  db:
    image: postgres:16
    container_name: mathsgraph-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-math_graph}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mathsgraph-network

  redis:
    image: redis:7-alpine
    container_name: mathsgraph-redis
    restart: always
    networks:
      - mathsgraph-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mathsgraph-backend:latest
    container_name: mathsgraph-backend
    restart: always
    environment:
      - DB_NAME=${DB_NAME:-math_graph}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ENVIRONMENT=production
      - PASSWORD_SALT=${PASSWORD_SALT}
    depends_on:
      - db
      - redis
    networks:
      - mathsgraph-network

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mathsgraph-frontend:latest
    container_name: mathsgraph-frontend
    restart: always
    networks:
      - mathsgraph-network

  nginx:
    image: nginx:alpine
    container_name: mathsgraph-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - mathsgraph-network

volumes:
  postgres_data:
  certbot_data:

networks:
  mathsgraph-network:
    driver: bridge
